<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Office Calm Chatbot</title>
  <link rel="stylesheet" href="/static/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
  <div class="app-container">
    <header class="header">
      <h1 class="title">Office Calm Chatbot</h1>
      <p class="subtitle">Hidden admin analysis + Gemini response (model: {{ model | default('gemini-1.5-flash') }})</p>
    </header>

    <div class="chat-container" id="chat"></div>

    <div class="input-container">
      <form id="form" class="input-form" autocomplete="off">
        <textarea id="msg" placeholder="Type your office problem... (Kannada/Hindi/English are OK)" rows="1" required></textarea>
        <button type="submit" id="sendBtn">Send</button>
      </form>
      <p class="footer-note">Notes: Your hidden analysis prompt stays on the server. The browser only sees your messages and the final reply.</p>
    </div>
  </div>

  <script>
    let currentSessionId = null;
    const chatEl = document.getElementById("chat");
    const form = document.getElementById("form");
    const msgEl = document.getElementById("msg");
    const sendBtn = document.getElementById("sendBtn");

    // Auto-resize textarea
    msgEl.addEventListener("input", () => {
      msgEl.style.height = "auto";
      msgEl.style.height = Math.min(msgEl.scrollHeight, 120) + "px";
    });

    // Enter to send
    msgEl.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        form.dispatchEvent(new Event("submit"));
      }
    });

    function addBubble(role, text) {
      const wrapper = document.createElement("div");
      wrapper.className = `message-wrapper ${role}`;

      const bubble = document.createElement("div");
      bubble.className = `bubble ${role}`;
      bubble.textContent = text;

      wrapper.appendChild(bubble);
      chatEl.appendChild(wrapper);
      chatEl.scrollTop = chatEl.scrollHeight;
      return wrapper;
    }

    async function loadInitialSession() {
      try {
        const res = await fetch("/api/sessions");
        const data = await res.json();
        if (data.sessions && data.sessions.length > 0) {
          currentSessionId = data.sessions[0].session_id;
          const histRes = await fetch(`/api/sessions/${currentSessionId}/history`);
          const histData = await histRes.json();
          if (histData.messages) {
            histData.messages.forEach(m => {
              if(m.role === "user" || m.role === "assistant") {
                addBubble(m.role, m.content);
              }
            });
          }
        }
      } catch (e) {
        console.error("Could not load history", e);
      }
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const text = msgEl.value.trim();
      if (!text) return;

      msgEl.value = "";
      msgEl.style.height = "auto";
      
      addBubble("user", text);

      const thinkingWrapper = document.createElement("div");
      thinkingWrapper.className = "message-wrapper assistant thinking-wrapper";
      const thinkingText = document.createElement("div");
      thinkingText.className = "thinking-text";
      thinkingText.textContent = "Thinking...";
      thinkingWrapper.appendChild(thinkingText);
      chatEl.appendChild(thinkingWrapper);
      chatEl.scrollTop = chatEl.scrollHeight;

      sendBtn.disabled = true;

      try {
        const res = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            message: text,
            session_id: currentSessionId || ""
          })
        });
        const data = await res.json();
        thinkingWrapper.remove();
        
        if (data.session_id) currentSessionId = data.session_id;
        
        if (data.error) {
          addBubble("assistant", "Error: " + data.error);
        } else {
          addBubble("assistant", data.reply);
        }
      } catch (err) {
        thinkingWrapper.remove();
        addBubble("assistant", "Connection error.");
      } finally {
        sendBtn.disabled = false;
        msgEl.focus();
      }
    });

    loadInitialSession();
  </script>
</body>
</html>
