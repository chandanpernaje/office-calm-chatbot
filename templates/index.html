<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Office Calm — Workplace Stress Support</title>
    <meta name="description" content="AI-powered chatbot to help you manage office stress, workplace conflicts, and burnout." />
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
    <!-- ═══ Sidebar ═══ -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="logo">
          <span class="logo-icon">🧘</span>
          <span class="logo-text">Office Calm</span>
        </div>
        <button class="new-chat-btn" id="newChatBtn" title="Start a new chat">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          New Chat
        </button>
      </div>
      <div class="sidebar-sessions" id="sessionList">
        <p class="sidebar-empty">No chat history yet</p>
      </div>
      <div class="sidebar-footer">
        <small>💼 Only office stress topics</small>
      </div>
    </aside>

    <!-- ═══ Main ═══ -->
    <main class="main" id="main">
      <!-- Top bar -->
      <header class="topbar">
        <button class="menu-btn" id="menuBtn" title="Toggle sidebar">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
        <div class="topbar-info">
          <h1 id="chatTitle">Office Calm Chatbot</h1>
          <span class="topbar-badge">
            {% if gemini_ready %}
              <span class="dot green"></span> Gemini Active ({{ model }})
            {% else %}
              <span class="dot red"></span> Offline Mode
            {% endif %}
          </span>
        </div>
      </header>

      <!-- Welcome screen (shown when no active chat) -->
      <section class="welcome" id="welcomeScreen">
        <div class="welcome-center">
          <div class="welcome-icon">🧘‍♂️</div>
          <h2>How can I help you today?</h2>
        </div>
        <div class="welcome-chips">
          <button class="chip" type="button" onclick="useChip(this)">My boss shouted at me today</button>
          <button class="chip" type="button" onclick="useChip(this)">I'm overwhelmed with deadlines</button>
          <button class="chip" type="button" onclick="useChip(this)">Conflict with a teammate</button>
          <button class="chip" type="button" onclick="useChip(this)">I feel burned out</button>
        </div>
      </section>

      <!-- Chat messages -->
      <section class="chat" id="chat"></section>

      <!-- Composer -->
      <form class="composer" id="form" autocomplete="off">
        <div class="input-wrap">
          <textarea
            id="msg"
            rows="1"
            maxlength="2000"
            placeholder="Describe your office stress… (English / Hindi / Kannada)"
            required
          ></textarea>
          <span class="char-count" id="charCount">0 / 2000</span>
          <button type="submit" id="sendBtn" title="Send message">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
          </button>
        </div>
      </form>
    </main>

    <script>
      /* ═══════════════════════════════
         STATE
         ═══════════════════════════════ */
      let currentSessionId = null;

      const chatEl       = document.getElementById("chat");
      const form         = document.getElementById("form");
      const msgEl        = document.getElementById("msg");
      const charCount    = document.getElementById("charCount");
      const welcomeScreen = document.getElementById("welcomeScreen");
      const sendBtn      = document.getElementById("sendBtn");
      const sessionList  = document.getElementById("sessionList");
      const chatTitle    = document.getElementById("chatTitle");
      const sidebar      = document.getElementById("sidebar");
      const menuBtn      = document.getElementById("menuBtn");
      const newChatBtn   = document.getElementById("newChatBtn");

      /* ═══ Sidebar toggle ═══ */
      menuBtn.addEventListener("click", () => sidebar.classList.toggle("open"));

      /* ═══ New chat ═══ */
      newChatBtn.addEventListener("click", () => {
        currentSessionId = null;
        chatEl.innerHTML = "";
        welcomeScreen.style.display = "flex";
        chatEl.style.display = "none";
        chatTitle.textContent = "Office Calm Chatbot";
        sidebar.classList.remove("open");
      });

      /* ═══ Char counter + auto‑resize ═══ */
      msgEl.addEventListener("input", () => {
        charCount.textContent = `${msgEl.value.length} / 2000`;
        msgEl.style.height = "auto";
        msgEl.style.height = Math.min(msgEl.scrollHeight, 120) + "px";
      });

      /* ═══ Quick chips ═══ */
      function useChip(el) {
        msgEl.value = el.textContent;
        charCount.textContent = `${msgEl.value.length} / 2000`;
        msgEl.focus();
      }

      /* ═══ Load sessions list ═══ */
      async function loadSessions() {
        try {
          const res  = await fetch("/api/sessions");
          const data = await res.json();

          if (!data.sessions || data.sessions.length === 0) {
            sessionList.innerHTML = '<p class="sidebar-empty">No chat history yet</p>';
            return;
          }

          sessionList.innerHTML = "";
          data.sessions.forEach(s => {
            const div = document.createElement("div");
            div.className = "session-item" + (s.session_id === currentSessionId ? " active" : "");
            div.innerHTML = `
              <span class="session-title">${escapeHtml(s.title || "New Chat")}</span>
              <button class="session-del" title="Delete" onclick="event.stopPropagation();deleteSession('${s.session_id}')">✕</button>
            `;
            div.addEventListener("click", () => loadSession(s.session_id, s.title));
            sessionList.appendChild(div);
          });
        } catch (e) {
          console.error("Failed to load sessions", e);
        }
      }

      /* ═══ Load a specific session ═══ */
      async function loadSession(sessionId, title) {
        currentSessionId = sessionId;
        chatEl.innerHTML = "";
        welcomeScreen.style.display = "none";
        chatEl.style.display = "flex";
        chatTitle.textContent = title || "Chat";
        sidebar.classList.remove("open");

        try {
          const res  = await fetch(`/api/sessions/${sessionId}/history`);
          const data = await res.json();
          (data.messages || []).forEach(m => addBubble(m.role, m.content));
        } catch (e) {
          console.error("Failed to load history", e);
        }
        loadSessions();
      }

      /* ═══ Delete session ═══ */
      async function deleteSession(sessionId) {
        if (!confirm("Delete this chat?")) return;
        try {
          await fetch(`/api/sessions/${sessionId}`, { method: "DELETE" });
          if (currentSessionId === sessionId) {
            currentSessionId = null;
            chatEl.innerHTML = "";
            welcomeScreen.style.display = "flex";
            chatEl.style.display = "none";
            chatTitle.textContent = "Office Calm Chatbot";
          }
          loadSessions();
        } catch (e) { console.error(e); }
      }

      /* ═══ Add chat message ═══ */
      function addBubble(role, text) {
        const row = document.createElement("div");
        row.className = `message-row ${role}`;

        const inner = document.createElement("div");
        inner.className = "message-inner";

        const avatar = document.createElement("div");
        avatar.className = `avatar ${role}`;
        avatar.innerHTML = role === "user" ? "U" : "🧘";

        const content = document.createElement("div");
        content.className = "message-content";
        content.textContent = text;

        inner.appendChild(avatar);
        inner.appendChild(content);
        row.appendChild(inner);

        chatEl.appendChild(row);
        chatEl.scrollTop = chatEl.scrollHeight;
      }

      /* ═══ Send message ═══ */
      async function sendMessage(text) {
        text = text.trim();
        if (!text) return;
        if (text.length > 2000) {
          alert("Message too long! Max 2000 characters.");
          return;
        }

        welcomeScreen.style.display = "none";
        chatEl.style.display = "flex";
        addBubble("user", text);

        /* Thinking indicator */
        const thinking = document.createElement("div");
        thinking.className = "message-row assistant thinking";
        thinking.innerHTML =
          '<div class="message-inner">' +
          '<div class="avatar assistant">🧘</div>' +
          '<div class="message-content">' +
          '<span class="typing-dots"><span></span><span></span><span></span></span>' +
          '</div></div>';
        chatEl.appendChild(thinking);
        chatEl.scrollTop = chatEl.scrollHeight;
        sendBtn.disabled = true;

        try {
          const res = await fetch("/api/chat", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              message: text,
              session_id: currentSessionId || "",
            }),
          });
          const data = await res.json();
          thinking.remove();

          if (!res.ok) {
            addBubble("assistant", `⚠️ Error: ${data?.error || "Request failed"}`);
            return;
          }

          /* Update session */
          if (data.session_id) {
            currentSessionId = data.session_id;
            if (chatTitle.textContent === "Office Calm Chatbot") {
              chatTitle.textContent = text.substring(0, 40) + (text.length > 40 ? "…" : "");
            }
          }

          addBubble("assistant", data.reply);

          if (data.warning) {
            const warn = document.createElement("div");
            warn.className = "warning-banner";
            warn.textContent = "⚠️ " + data.warning;
            chatEl.appendChild(warn);
          }

          loadSessions();
        } catch (e) {
          thinking.remove();
          addBubble("assistant", `⚠️ Connection error: ${e?.message || e}`);
        } finally {
          sendBtn.disabled = false;
          msgEl.focus();
        }
      }

      /* ═══ Form submit ═══ */
      form.addEventListener("submit", (e) => {
        e.preventDefault();
        const text = msgEl.value.trim();
        if (!text) return;
        msgEl.value = "";
        msgEl.style.height = "auto";
        charCount.textContent = "0 / 2000";
        sendMessage(text);
      });

      /* ═══ Enter to send (Shift+Enter = newline) ═══ */
      msgEl.addEventListener("keydown", (e) => {
        if (e.key === "Enter" && !e.shiftKey) {
          e.preventDefault();
          form.dispatchEvent(new Event("submit"));
        }
      });

      /* ═══ Escape HTML ═══ */
      function escapeHtml(str) {
        const d = document.createElement("div");
        d.textContent = str;
        return d.innerHTML;
      }

      /* ═══ Init ═══ */
      loadSessions();
    </script>
  </body>
</html>
