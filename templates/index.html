<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Office Calm Chatbot</title>
  <link rel="stylesheet" href="/static/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
  <div class="app">
    <div class="overlay" id="overlay"></div>

    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <button class="new-chat-btn" id="newChatBtn">+ New Chat</button>
      <div class="sessions" id="sessionList"></div>
      <div class="sidebar-footer">💼 Office Calm</div>
    </aside>

    <!-- Main -->
    <div class="main">
      <div class="topbar">
        <button class="menu-btn" id="menuBtn">☰</button>
        <span>Office Calm Chatbot</span>
      </div>

      <div class="messages" id="chat">
        <div class="welcome" id="welcome">
          <div class="welcome-emoji">🧘‍♂️</div>
          <h2>How can I help you today?</h2>
          <p>I only help with office stress, burnout & workplace conflicts.</p>
          <div class="chips">
            <button onclick="useChip('My boss shouted at me')">😠 My boss shouted at me</button>
            <button onclick="useChip('I feel burned out')">🔥 I feel burned out</button>
            <button onclick="useChip('Conflict with a teammate')">🤝 Conflict with a teammate</button>
            <button onclick="useChip('Overwhelmed with deadlines')">😰 Overwhelmed with deadlines</button>
          </div>
        </div>
      </div>

      <div class="composer">
        <form id="form">
          <textarea id="msg" placeholder="Type your office problem..." rows="1" maxlength="2000"></textarea>
          <button type="submit" id="sendBtn">➤</button>
        </form>
        <small>Office Calm can make mistakes. Only for workplace stress.</small>
      </div>
    </div>
  </div>

  <script>
    let currentSessionId = null;
    const chat = document.getElementById("chat");
    const form = document.getElementById("form");
    const msg = document.getElementById("msg");
    const sendBtn = document.getElementById("sendBtn");
    const sidebar = document.getElementById("sidebar");
    const overlay = document.getElementById("overlay");
    const sessionList = document.getElementById("sessionList");

    // Sidebar toggle
    document.getElementById("menuBtn").onclick = () => { sidebar.classList.toggle("open"); overlay.classList.toggle("show"); };
    overlay.onclick = () => { sidebar.classList.remove("open"); overlay.classList.remove("show"); };

    // Auto-resize textarea
    msg.addEventListener("input", () => { msg.style.height = "auto"; msg.style.height = Math.min(msg.scrollHeight, 150) + "px"; });

    // Enter to send
    msg.addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); form.dispatchEvent(new Event("submit")); } });

    function addMsg(role, text) {
      const div = document.createElement("div");
      div.className = "msg " + role;
      div.innerHTML = `<div class="msg-avatar">${role === "user" ? "U" : "🧘"}</div><div class="msg-text"><b>${role === "user" ? "You" : "Office Calm"}</b><p>${text.replace(/\n/g, "<br>")}</p></div>`;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }

    async function loadSessions() {
      try {
        const r = await (await fetch("/api/sessions")).json();
        sessionList.innerHTML = "";
        (r.sessions || []).forEach(s => {
          const d = document.createElement("div");
          d.className = "session" + (s.session_id === currentSessionId ? " active" : "");
          d.innerHTML = `<span>${s.title || "New Chat"}</span><button class="del-btn" title="Delete">✕</button>`;
          d.querySelector(".del-btn").onclick = async (e) => { e.stopPropagation(); if(confirm("Delete?")) { await fetch("/api/sessions/" + s.session_id, {method:"DELETE"}); if(currentSessionId === s.session_id) startNew(); else loadSessions(); }};
          d.onclick = () => loadSession(s.session_id);
          sessionList.appendChild(d);
        });
      } catch(e) {}
    }

    async function loadSession(sid) {
      currentSessionId = sid;
      chat.innerHTML = "";
      loadSessions();
      try {
        const r = await (await fetch("/api/sessions/" + sid + "/history")).json();
        (r.messages || []).forEach(m => { if(m.role === "user" || m.role === "assistant") addMsg(m.role, m.content); });
      } catch(e) {}
    }

    function useChip(text) { msg.value = text; msg.focus(); }

    function startNew() {
      currentSessionId = null;
      chat.innerHTML = `<div class="welcome" id="welcome"><div class="welcome-emoji">🧘‍♂️</div><h2>How can I help you today?</h2><p>I only help with office stress, burnout & workplace conflicts.</p><div class="chips"><button onclick="useChip('My boss shouted at me')">😠 My boss shouted at me</button><button onclick="useChip('I feel burned out')">🔥 I feel burned out</button><button onclick="useChip('Conflict with a teammate')">🤝 Conflict with a teammate</button><button onclick="useChip('Overwhelmed with deadlines')">😰 Overwhelmed with deadlines</button></div></div>`;
      loadSessions();
      sidebar.classList.remove("open"); overlay.classList.remove("show");
    }

    document.getElementById("newChatBtn").onclick = startNew;

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const text = msg.value.trim();
      if (!text) return;
      msg.value = ""; msg.style.height = "auto";

      const w = document.getElementById("welcome"); if(w) w.remove();
      addMsg("user", text);

      // Typing dots
      const dots = document.createElement("div");
      dots.className = "msg assistant";
      dots.innerHTML = '<div class="msg-avatar">🧘</div><div class="msg-text"><b>Office Calm</b><p class="dots"><span>.</span><span>.</span><span>.</span></p></div>';
      chat.appendChild(dots); chat.scrollTop = chat.scrollHeight;
      sendBtn.disabled = true;

      try {
        const r = await (await fetch("/api/chat", { method: "POST", headers: {"Content-Type":"application/json"}, body: JSON.stringify({message: text, session_id: currentSessionId || ""}) })).json();
        dots.remove();
        if (r.session_id) currentSessionId = r.session_id;
        loadSessions();
        addMsg("assistant", r.error ? "⚠️ " + r.error : r.reply);
      } catch(err) {
        dots.remove();
        addMsg("assistant", "⚠️ Connection error.");
      } finally {
        sendBtn.disabled = false; msg.focus();
      }
    });

    // Init
    (async () => { try { const r = await (await fetch("/api/sessions")).json(); if(r.sessions?.length) loadSession(r.sessions[0].session_id); } catch(e){} })();
  </script>
</body>
</html>
