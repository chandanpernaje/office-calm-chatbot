<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Office Calm Chatbot</title>
  <link rel="stylesheet" href="/static/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
  <!-- Sidebar -->
  <div class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div style="display: flex; justify-content: space-between; align-items: center; width: 100%;">
        <h2>Chat History</h2>
        <button class="new-chat-btn" id="newChatBtn">New Chat</button>
      </div>
      <input type="text" id="searchHistory" class="search-history-input" placeholder="Search history..." autocomplete="off">
    </div>
    <div class="session-list" id="sessionList"></div>
  </div>

  <div class="app-container" id="appContainer">
    <header class="header">
      <button class="menu-btn" id="menuBtn">☰</button>
      <div class="header-titles">
        <h1 class="title">Office Calm Chatbot</h1>
        <p class="subtitle">Hidden admin analysis + Gemini response (model: {{ model | default('gemini-1.5-flash') }})</p>
      </div>
    </header>

    <div class="chat-container" id="chat"></div>

    <div class="input-container">
      <form id="form" class="input-form" autocomplete="off">
        <textarea id="msg" placeholder="Type your office problem... (Kannada/Hindi/English are OK)" rows="1" required></textarea>
        <button type="submit" id="sendBtn">Send</button>
      </form>
      <p class="footer-note">Notes: Your hidden analysis prompt stays on the server. The browser only sees your messages and the final reply.</p>
    </div>
  </div>

  <script>
    let currentSessionId = null;
    const chatEl = document.getElementById("chat");
    const form = document.getElementById("form");
    const msgEl = document.getElementById("msg");
    const sendBtn = document.getElementById("sendBtn");
    
    // Sidebar elements
    const sidebar = document.getElementById("sidebar");
    const menuBtn = document.getElementById("menuBtn");
    const newChatBtn = document.getElementById("newChatBtn");
    const sessionList = document.getElementById("sessionList");
    const searchHistory = document.getElementById("searchHistory");

    // Toggle sidebar
    menuBtn.addEventListener("click", () => {
      sidebar.classList.toggle("open");
    });

    // Search history filter
    searchHistory.addEventListener("input", (e) => {
      const q = e.target.value.toLowerCase();
      document.querySelectorAll(".session-item").forEach(item => {
        const title = item.querySelector(".session-title").textContent.toLowerCase();
        item.style.display = title.includes(q) ? "flex" : "none";
      });
    });

    // Auto-resize textarea
    msgEl.addEventListener("input", () => {
      msgEl.style.height = "auto";
      msgEl.style.height = Math.min(msgEl.scrollHeight, 120) + "px";
    });

    // Enter to send
    msgEl.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        form.dispatchEvent(new Event("submit"));
      }
    });

    function addBubble(role, text) {
      const wrapper = document.createElement("div");
      wrapper.className = `message-wrapper ${role}`;

      const bubble = document.createElement("div");
      bubble.className = `bubble ${role}`;
      bubble.textContent = text;

      wrapper.appendChild(bubble);
      chatEl.appendChild(wrapper);
      chatEl.scrollTop = chatEl.scrollHeight;
      return wrapper;
    }

    async function loadSessions() {
      try {
        const res = await fetch("/api/sessions");
        const data = await res.json();
        sessionList.innerHTML = "";
        
        if (data.sessions && data.sessions.length > 0) {
          data.sessions.forEach(s => {
            const div = document.createElement("div");
            div.className = "session-item" + (s.session_id === currentSessionId ? " active" : "");
            
            const titleSpan = document.createElement("span");
            titleSpan.className = "session-title";
            titleSpan.textContent = s.title || "New Chat";
            
            const delBtn = document.createElement("button");
            delBtn.className = "session-del";
            delBtn.textContent = "✕";
            delBtn.onclick = async (ev) => {
              ev.stopPropagation();
              if(confirm("Delete this chat?")) {
                await fetch(`/api/sessions/${s.session_id}`, { method: "DELETE" });
                if(currentSessionId === s.session_id) {
                  startNewChat();
                } else {
                  loadSessions();
                }
              }
            };
            
            div.appendChild(titleSpan);
            div.appendChild(delBtn);
            div.onclick = () => loadSession(s.session_id);
            sessionList.appendChild(div);
          });
        }
      } catch(e) {
        console.error("Could not load sessions", e);
      }
    }

    async function loadSession(sessionId) {
      currentSessionId = sessionId;
      chatEl.innerHTML = "";
      sidebar.classList.remove("open");
      loadSessions(); // update active state
      try {
        const histRes = await fetch(`/api/sessions/${sessionId}/history`);
        const histData = await histRes.json();
        if (histData.messages) {
          histData.messages.forEach(m => {
            if(m.role === "user" || m.role === "assistant") {
              addBubble(m.role, m.content);
            }
          });
        }
      } catch(e) {
        console.error(e);
      }
    }

    function startNewChat() {
      currentSessionId = null;
      chatEl.innerHTML = "";
      sidebar.classList.remove("open");
      loadSessions();
    }

    newChatBtn.addEventListener("click", startNewChat);

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const text = msgEl.value.trim();
      if (!text) return;

      msgEl.value = "";
      msgEl.style.height = "auto";
      
      addBubble("user", text);

      const thinkingWrapper = document.createElement("div");
      thinkingWrapper.className = "message-wrapper assistant thinking-wrapper";
      const thinkingText = document.createElement("div");
      thinkingText.className = "thinking-text";
      thinkingText.textContent = "Thinking...";
      thinkingWrapper.appendChild(thinkingText);
      chatEl.appendChild(thinkingWrapper);
      chatEl.scrollTop = chatEl.scrollHeight;

      sendBtn.disabled = true;

      try {
        const res = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            message: text,
            session_id: currentSessionId || ""
          })
        });
        const data = await res.json();
        thinkingWrapper.remove();
        
        if (data.session_id) currentSessionId = data.session_id;
        loadSessions(); // refresh the list to show new chat title
        
        if (data.error) {
          addBubble("assistant", "Error: " + data.error);
        } else {
          addBubble("assistant", data.reply);
        }
      } catch (err) {
        thinkingWrapper.remove();
        addBubble("assistant", "Connection error.");
      } finally {
        sendBtn.disabled = false;
        msgEl.focus();
      }
    });

    // Auto load most recent session on startup
    async function init() {
      try {
        const res = await fetch("/api/sessions");
        const data = await res.json();
        if (data.sessions && data.sessions.length > 0) {
          loadSession(data.sessions[0].session_id);
        }
      } catch(e) {}
    }
    init();
  </script>
</body>
</html>
