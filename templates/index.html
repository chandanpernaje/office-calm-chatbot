<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Office Calm Chatbot</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/static/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
  <div class="container">
    <header>
      <h1>Office Calm Chatbot</h1>
      <p>Hidden admin analysis + Gemini response (model: {{ model }})</p>
    </header>

    <div class="chat-box" id="chat">
      <!-- Messages go here -->
    </div>

    <div class="composer">
      <form id="form">
        <textarea id="msg" placeholder="Type your office problem... (Kannada/Hindi/English are OK)" rows="1" required></textarea>
        <button type="submit" id="sendBtn">Send</button>
      </form>
      <div class="footer-note">
        Notes: Your hidden analysis prompt stays on the server. The browser only sees your messages and the final reply.
      </div>
    </div>
  </div>

  <script>
    const chat = document.getElementById("chat");
    const form = document.getElementById("form");
    const msg = document.getElementById("msg");
    const sendBtn = document.getElementById("sendBtn");
    
    // Auto-resize textarea
    msg.addEventListener("input", () => {
      msg.style.height = "auto";
      msg.style.height = Math.min(msg.scrollHeight, 120) + "px";
    });

    // Enter to send
    msg.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        form.dispatchEvent(new Event("submit"));
      }
    });

    function addMsg(role, text) {
      const row = document.createElement("div");
      row.className = "msg-row " + role;
      
      const bubble = document.createElement("div");
      bubble.className = "bubble";
      bubble.innerHTML = text.replace(/\n/g, "<br>");
      
      row.appendChild(bubble);
      chat.appendChild(row);
      chat.scrollTop = chat.scrollHeight;
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const text = msg.value.trim();
      if (!text) return;
      
      msg.value = "";
      msg.style.height = "auto";
      
      addMsg("user", text);
      
      // Thinking indicator
      const dotsRow = document.createElement("div");
      dotsRow.className = "msg-row assistant";
      dotsRow.innerHTML = '<div class="bubble thinking">...</div>';
      chat.appendChild(dotsRow);
      chat.scrollTop = chat.scrollHeight;
      
      sendBtn.disabled = true;

      try {
        const res = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: text })
        });
        const data = await res.json();
        dotsRow.remove();
        
        if (data.error) {
          addMsg("assistant", "Error: " + data.error);
        } else {
          addMsg("assistant", data.reply);
        }
      } catch (err) {
        dotsRow.remove();
        addMsg("assistant", "Connection error.");
      } finally {
        sendBtn.disabled = false;
        msg.focus();
      }
    });
  </script>
</body>
</html>
