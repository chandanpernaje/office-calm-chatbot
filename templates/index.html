<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Office Calm Chatbot (LLM-Based)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- Fonts & Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  
  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      background: radial-gradient(circle at top right, #2a2c35 0%, #121217 100%);
      color: #e5e7eb;
      height: 100vh;
      display: flex;
      overflow: hidden;
    }
    
    /* ── Sidebar ── */
    .sidebar {
      width: 280px;
      background: rgba(15, 15, 20, 0.7);
      backdrop-filter: blur(20px);
      border-right: 1px solid rgba(255,255,255,0.06);
      display: flex;
      flex-direction: column;
      height: 100vh;
      z-index: 100;
    }
    .new-chat-btn {
      margin: 20px 15px;
      padding: 14px;
      background: linear-gradient(135deg, #5b7afc 0%, #4461e8 100%);
      border: none;
      color: white;
      border-radius: 12px;
      cursor: pointer;
      text-align: center;
      font-weight: 600;
      font-size: 14px;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(91, 122, 252, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }
    .new-chat-btn:hover { 
      transform: translateY(-2px); 
      box-shadow: 0 8px 25px rgba(91, 122, 252, 0.45);
      filter: brightness(1.1);
    }
    
    .history-list {
      flex: 1;
      overflow-y: auto;
      padding: 0 10px 20px 10px;
    }
    .history-list::-webkit-scrollbar { width: 4px; }
    .history-list::-webkit-scrollbar-thumb { background-color: rgba(255,255,255,0.1); border-radius: 4px;}
    
    .session-item {
      padding: 12px 16px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 13.5px;
      color: #9ca3af;
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: all 0.2s;
      border: 1px solid transparent;
      group;
    }
    .session-item:hover { 
      background-color: rgba(255,255,255,0.05); 
      color: #fff;
    }
    .session-item.active { 
      background-color: rgba(91, 122, 252, 0.12); 
      border: 1px solid rgba(91, 122, 252, 0.25);
      color: #fff;
      font-weight: 500;
    }
    .session-item i.delete-btn {
      opacity: 0;
      color: #ef4444;
      transition: opacity 0.2s;
      font-size: 14px;
    }
    .session-item:hover i.delete-btn { opacity: 1; }
    
    /* ── Main Area ── */
    .main-area {
      flex: 1;
      display: flex;
      justify-content: center;
      height: 100vh;
      position: relative;
    }
    .container-custom {
      width: 100%;
      max-width: 900px;
      display: flex;
      flex-direction: column;
      height: 100vh;
      padding: 0 30px 30px 30px;
    }
    header { 
      padding: 40px 0 25px 0; 
      text-align: center; 
      border-bottom: 1px solid rgba(255,255,255,0.04); 
      margin-bottom: 30px;
    }
    header h1 { 
      color: #a5b4fc; 
      font-size: 28px; 
      font-weight: 700; 
      letter-spacing: -0.8px;
      margin-bottom: 8px; 
    }
    header p { color: #6b7280; font-size: 14px; }
    
    .chat-box {
      flex: 1; 
      overflow-y: auto; 
      display: flex; 
      flex-direction: column; 
      gap: 32px; 
      padding-right: 15px; 
      margin-bottom: 30px; 
      scroll-behavior: smooth;
    }
    .chat-box::-webkit-scrollbar { width: 6px; }
    .chat-box::-webkit-scrollbar-thumb { background-color: rgba(255,255,255,0.08); border-radius: 6px; }
    
    .msg-row { display: flex; width: 100%; animation: slideUp 0.5s cubic-bezier(0.16, 1, 0.3, 1); }
    @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    
    .msg-row.user { justify-content: flex-end; }
    .msg-row.assistant { justify-content: flex-start; }
    
    .bubble {
      max-width: 85%; 
      padding: 18px 24px; 
      font-size: 15px; 
      line-height: 1.7; 
      word-wrap: break-word; 
      box-shadow: 0 10px 30px rgba(0,0,0,0.15);
      border-radius: 24px;
    }
    .msg-row.user .bubble {
      background: linear-gradient(135deg, #5b7afc 0%, #4461e8 100%); 
      color: white; 
      border-bottom-right-radius: 6px;
    }
    .msg-row.assistant .bubble {
      background-color: #24262e; 
      color: #e5e7eb; 
      border-bottom-left-radius: 6px; 
      border: 1px solid rgba(255,255,255,0.05);
    }
    .bubble.thinking { 
      color: #6b7280; 
      background: none !important; 
      box-shadow: none !important; 
      border: none !important; 
      padding: 15px 24px; 
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse { 0% { opacity: 0.4; } 50% { opacity: 1; } 100% { opacity: 0.4; } }
    
    .composer { 
      background: rgba(30, 31, 38, 0.6); 
      backdrop-filter: blur(15px);
      padding: 20px; 
      border-radius: 24px; 
      border: 1px solid rgba(255,255,255,0.08); 
      box-shadow: 0 15px 50px rgba(0,0,0,0.3);
    }
    #form { display: flex; align-items: flex-end; gap: 18px; }
    textarea {
      flex: 1; background: transparent; border: none; color: #fff; font-family: inherit; font-size: 15.5px; resize: none; outline: none; min-height: 24px; max-height: 160px; padding: 10px 0; line-height: 1.6;
    }
    textarea::placeholder { color: #4b5563; }
    
    .send-btn {
      background: #5b7afc; 
      color: white; 
      border: none; 
      border-radius: 16px; 
      width: 48px;
      height: 48px;
      font-size: 18px; 
      cursor: pointer; 
      transition: all 0.2s ease; 
      box-shadow: 0 5px 15px rgba(91, 122, 252, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .send-btn:hover { 
      background: #6a88ff;
      transform: scale(1.05); 
      box-shadow: 0 8px 20px rgba(91, 122, 252, 0.4); 
    }
    .send-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
    
    .footer-note { font-size: 11.5px; color: #4b5563; text-align: center; margin-top: 12px; font-weight: 500;}
  </style>
</head>
<body>

  <!-- Sidebar -->
  <div class="sidebar">
    <button class="new-chat-btn" id="newChatBtn">
      <i class="bi bi-plus-lg"></i> New Conversation
    </button>
    <div class="history-list" id="historyList">
      <!-- Session items -->
    </div>
  </div>

  <!-- Main Area -->
  <div class="main-area">
    <div class="container-custom">
      <header>
        <h1><i class="bi bi-shield-check"></i> Office Calm Support</h1>
        <p>Professional LLM-Powered Workplace Mental Health Consultant</p>
      </header>

      <div class="chat-box" id="chat">
        <!-- Messages -->
      </div>

      <div class="composer">
        <form id="form">
          <textarea id="msg" placeholder="Tell me about your workplace stress..." rows="1" required></textarea>
          <button type="submit" class="send-btn" id="sendBtn">
            <i class="bi bi-send-fill"></i>
          </button>
        </form>
        <div class="footer-note">
          <i class="bi bi-info-circle"></i> AI-powered analysis is private and strictly professional.
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const chat = document.getElementById("chat");
    const form = document.getElementById("form");
    const msg = document.getElementById("msg");
    const sendBtn = document.getElementById("sendBtn");
    const historyList = document.getElementById("historyList");
    const newChatBtn = document.getElementById("newChatBtn");
    
    // Restore session from localStorage if available
    let currentSessionId = localStorage.getItem("lastSessionId");

    async function loadSessions() {
      try {
        const res = await fetch("/api/sessions");
        const data = await res.json();
        historyList.innerHTML = "";
        data.sessions.forEach(s => {
          const div = document.createElement("div");
          div.className = "session-item" + (s.session_id === currentSessionId ? " active" : "");
          
          const title = document.createElement("span");
          title.textContent = s.title || "New Chat";
          title.style.overflow = "hidden";
          title.style.textOverflow = "ellipsis";
          
          const delIcon = document.createElement("i");
          delIcon.className = "bi bi-trash3-fill delete-btn";
          delIcon.onclick = (e) => {
            e.stopPropagation();
            deleteSession(s.session_id);
          };
          
          div.appendChild(title);
          div.appendChild(delIcon);
          div.onclick = () => loadSessionHistory(s.session_id);
          historyList.appendChild(div);
        });

        // Auto-load latest session if none is selected
        if (!currentSessionId && data.sessions.length > 0) {
           loadSessionHistory(data.sessions[0].session_id);
        } else if (currentSessionId && chat.innerHTML === "") {
           // Reload history for the persisted session
           loadSessionHistory(currentSessionId);
        }
      } catch (err) { console.error(err); }
    }

    async function deleteSession(id) {
      if (!confirm("Are you sure you want to delete this chat history?")) return;
      try {
        await fetch(`/api/sessions/${id}`, { method: "DELETE" });
        if (currentSessionId === id) {
          currentSessionId = null;
          localStorage.removeItem("lastSessionId");
          chat.innerHTML = "";
        }
        loadSessions();
      } catch (err) { console.error(err); }
    }

    async function loadSessionHistory(sessionId) {
      currentSessionId = sessionId;
      localStorage.setItem("lastSessionId", sessionId);
      chat.innerHTML = "";
      // Refresh sidebar to show active state
      const items = historyList.querySelectorAll(".session-item");
      items.forEach(i => i.classList.remove("active"));
      
      try {
        const res = await fetch(`/api/sessions/${sessionId}/history`);
        const data = await res.json();
        data.messages.forEach(m => addMsg(m.role, m.content));
      } catch (err) { console.error(err); }
      loadSessions(); 
    }

    newChatBtn.onclick = () => {
      currentSessionId = null;
      localStorage.removeItem("lastSessionId");
      chat.innerHTML = "";
      loadSessions();
      msg.focus();
    };
    
    msg.addEventListener("input", () => {
      msg.style.height = "auto";
      msg.style.height = Math.min(msg.scrollHeight, 160) + "px";
    });

    msg.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        form.dispatchEvent(new Event("submit"));
      }
    });

    function addMsg(role, text) {
      const row = document.createElement("div");
      row.className = "msg-row " + role;
      const bubble = document.createElement("div");
      bubble.className = "bubble";
      bubble.innerHTML = text.replace(/\n/g, "<br>");
      row.appendChild(bubble);
      chat.appendChild(row);
      chat.scrollTop = chat.scrollHeight;
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const text = msg.value.trim();
      if (text.length < 2) return;
      
      msg.value = "";
      msg.style.height = "auto";
      addMsg("user", text);
      
      const dotsRow = document.createElement("div");
      dotsRow.className = "msg-row assistant";
      dotsRow.innerHTML = '<div class="bubble thinking"><i class="bi bi-cpu-fill"></i> Consulting AI...</div>';
      chat.appendChild(dotsRow);
      chat.scrollTop = chat.scrollHeight;
      
      sendBtn.disabled = true;

      try {
        const res = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: text, session_id: currentSessionId })
        });
        const data = await res.json();
        dotsRow.remove();
        
        // Ensure the sidebar updates even if it's not a brand new session
        if (data.session_id) {
          currentSessionId = data.session_id;
          loadSessions(); 
        }
        
        if (data.error) addMsg("assistant", "Error: " + data.error);
        else addMsg("assistant", data.reply);
      } catch (err) {
        dotsRow.remove();
        addMsg("assistant", "Connection error.");
      } finally {
        sendBtn.disabled = false;
        msg.focus();
      }
    });

    // Refresh history every 30 seconds automatically just in case
    setInterval(loadSessions, 30000);
    loadSessions();
  </script>
</body>
</html>
