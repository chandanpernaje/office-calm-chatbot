<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Office Calm Chatbot</title>
  <link rel="stylesheet" href="/static/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
  <div class="app-container">
    <div class="sidebar-overlay" id="overlay"></div>
    <!-- Sidebar -->
    <nav class="sidebar" id="sidebar">
      <div class="sidebar-top">
        <button class="new-chat-btn" id="newChatBtn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          New Chat
        </button>
        <div class="search-box">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input type="text" id="searchHistory" placeholder="Search chats..." autocomplete="off">
        </div>
      </div>
      
      <div class="session-list" id="sessionList"></div>
      
      <div class="sidebar-bottom">
        <p>💼 Office Calm Support</p>
      </div>
    </nav>

    <!-- Main Content -->
    <main class="main-content">
      <header class="header">
        <button class="menu-btn" id="menuBtn">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
        <div class="header-title">Office Calm Chatbot</div>
      </header>

      <div class="chat-container" id="chat"></div>

      <div class="input-area">
        <form id="form" class="input-form">
          <textarea id="msg" placeholder="Type your office problem... (English/Hindi/Kannada)" rows="1" required></textarea>
          <button type="submit" id="sendBtn">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
          </button>
        </form>
        <p class="footer-note">Office Calm can make mistakes. Focus is strictly on workplace stress.</p>
      </div>
    </main>
  </div>

  <script>
    let currentSessionId = null;
    const chatEl = document.getElementById("chat");
    const form = document.getElementById("form");
    const msgEl = document.getElementById("msg");
    const sendBtn = document.getElementById("sendBtn");
    
    // Sidebar elements
    const sidebar = document.getElementById("sidebar");
    const menuBtn = document.getElementById("menuBtn");
    const newChatBtn = document.getElementById("newChatBtn");
    const sessionList = document.getElementById("sessionList");
    const searchHistory = document.getElementById("searchHistory");
    const overlay = document.getElementById("overlay");

    function toggleSidebar() {
      sidebar.classList.toggle("open");
      overlay.classList.toggle("show");
    }

    // Toggle sidebar
    menuBtn.addEventListener("click", toggleSidebar);
    overlay.addEventListener("click", toggleSidebar);

    // Search history filter
    searchHistory.addEventListener("input", (e) => {
      const q = e.target.value.toLowerCase();
      document.querySelectorAll(".session-item").forEach(item => {
        const title = item.querySelector(".session-title").textContent.toLowerCase();
        item.style.display = title.includes(q) ? "flex" : "none";
      });
    });

    // Auto-resize textarea
    msgEl.addEventListener("input", () => {
      msgEl.style.height = "auto";
      msgEl.style.height = Math.min(msgEl.scrollHeight, 200) + "px";
    });

    // Enter to send
    msgEl.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        form.dispatchEvent(new Event("submit"));
      }
    });

    function addBubble(role, text) {
      const row = document.createElement("div");
      row.className = `message-row ${role}`;

      const avatar = document.createElement("div");
      avatar.className = "avatar";
      avatar.textContent = role === "user" ? "You" : "OC";

      const content = document.createElement("div");
      content.className = "message-content";
      content.textContent = text;

      row.appendChild(avatar);
      row.appendChild(content);
      chatEl.appendChild(row);
      chatEl.scrollTop = chatEl.scrollHeight;
      return row;
    }

    async function loadSessions() {
      try {
        const res = await fetch("/api/sessions");
        const data = await res.json();
        sessionList.innerHTML = "";
        
        if (data.sessions && data.sessions.length > 0) {
          data.sessions.forEach(s => {
            const div = document.createElement("div");
            div.className = "session-item" + (s.session_id === currentSessionId ? " active" : "");
            
            const titleSpan = document.createElement("span");
            titleSpan.className = "session-title";
            titleSpan.textContent = s.title || "New Chat";
            
            const delBtn = document.createElement("button");
            delBtn.className = "session-del";
            delBtn.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>';
            delBtn.onclick = async (ev) => {
              ev.stopPropagation();
              if(confirm("Delete this chat?")) {
                await fetch(`/api/sessions/${s.session_id}`, { method: "DELETE" });
                if(currentSessionId === s.session_id) {
                  startNewChat();
                } else {
                  loadSessions();
                }
              }
            };
            
            div.appendChild(titleSpan);
            div.appendChild(delBtn);
            div.onclick = () => {
              loadSession(s.session_id);
              if (window.innerWidth <= 768) {
                sidebar.classList.remove("open");
              }
            };
            sessionList.appendChild(div);
          });
        }
      } catch(e) {
        console.error("Could not load sessions", e);
      }
    }

    async function loadSession(sessionId) {
      currentSessionId = sessionId;
      chatEl.innerHTML = "";
      loadSessions(); // update active state
      try {
        const histRes = await fetch(`/api/sessions/${sessionId}/history`);
        const histData = await histRes.json();
        if (histData.messages) {
          histData.messages.forEach(m => {
            if(m.role === "user" || m.role === "assistant") {
              addBubble(m.role, m.content);
            }
          });
        }
      } catch(e) {
        console.error(e);
      }
    }

    function startNewChat() {
      currentSessionId = null;
      chatEl.innerHTML = "";
      loadSessions();
      if (window.innerWidth <= 768) {
        sidebar.classList.remove("open");
      }
    }

    newChatBtn.addEventListener("click", startNewChat);

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const text = msgEl.value.trim();
      if (!text) return;

      msgEl.value = "";
      msgEl.style.height = "auto";
      
      addBubble("user", text);

      const thinkingRow = document.createElement("div");
      thinkingRow.className = "message-row assistant thinking";
      thinkingRow.innerHTML = '<div class="avatar">OC</div><div class="message-content">Thinking...</div>';
      chatEl.appendChild(thinkingRow);
      chatEl.scrollTop = chatEl.scrollHeight;

      sendBtn.disabled = true;

      try {
        const res = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            message: text,
            session_id: currentSessionId || ""
          })
        });
        const data = await res.json();
        thinkingRow.remove();
        
        if (data.session_id) currentSessionId = data.session_id;
        loadSessions(); // refresh the list to show new chat title
        
        if (data.error) {
          addBubble("assistant", "Error: " + data.error);
        } else {
          addBubble("assistant", data.reply);
        }
      } catch (err) {
        thinkingRow.remove();
        addBubble("assistant", "Connection error.");
      } finally {
        sendBtn.disabled = false;
        msgEl.focus();
      }
    });

    // Auto load most recent session on startup
    async function init() {
      try {
        const res = await fetch("/api/sessions");
        const data = await res.json();
        if (data.sessions && data.sessions.length > 0) {
          loadSession(data.sessions[0].session_id);
        }
      } catch(e) {}
    }
    init();
  </script>
</body>
</html>
