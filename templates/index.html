<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Office Calm Chatbot</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      background: radial-gradient(circle at top right, #353842 0%, #1e1e24 100%);
      color: #e5e7eb;
      height: 100vh;
      display: flex;
    }
    
    /* ── Sidebar ── */
    .sidebar {
      width: 280px;
      background: rgba(20, 20, 25, 0.6);
      backdrop-filter: blur(10px);
      border-right: 1px solid rgba(255,255,255,0.05);
      display: flex;
      flex-direction: column;
      height: 100vh;
      box-shadow: 5px 0 20px rgba(0,0,0,0.3);
      z-index: 10;
    }
    .new-chat-btn {
      margin: 20px 15px;
      padding: 12px;
      background: linear-gradient(135deg, #5b7afc 0%, #4461e8 100%);
      border: 1px solid rgba(255,255,255,0.1);
      color: white;
      border-radius: 10px;
      cursor: pointer;
      text-align: center;
      font-weight: 600;
      font-size: 14px;
      letter-spacing: 0.5px;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 4px 15px rgba(91, 122, 252, 0.25);
    }
    .new-chat-btn:hover { 
      transform: translateY(-2px); 
      box-shadow: 0 8px 20px rgba(91, 122, 252, 0.4);
      filter: brightness(1.1);
    }
    
    .history-list {
      flex: 1;
      overflow-y: auto;
      padding: 0 10px 20px 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .history-list::-webkit-scrollbar { width: 4px; }
    .history-list::-webkit-scrollbar-thumb { background-color: rgba(255,255,255,0.1); border-radius: 4px;}
    
    .session-item {
      padding: 14px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      color: #d1d5db;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      transition: all 0.2s;
      border: 1px solid transparent;
    }
    .session-item:hover { 
      background-color: rgba(255,255,255,0.05); 
      color: #fff;
    }
    .session-item.active { 
      background-color: rgba(91, 122, 252, 0.15); 
      border: 1px solid rgba(91, 122, 252, 0.3);
      color: #fff;
      font-weight: 500;
    }
    
    /* ── Main Chat Area ── */
    .main-area {
      flex: 1;
      display: flex;
      justify-content: center;
      height: 100vh;
      position: relative;
    }
    .container {
      width: 100%;
      max-width: 850px;
      display: flex;
      flex-direction: column;
      height: 100vh;
      padding: 0 20px 20px 20px;
    }
    header { 
      padding: 30px 0 20px 0; 
      text-align: center; 
      border-bottom: 1px solid rgba(255,255,255,0.03); 
      margin-bottom: 24px;
    }
    header h1 { 
      color: #a5b4fc; 
      font-size: 26px; 
      font-weight: 700; 
      letter-spacing: -0.5px;
      margin-bottom: 6px; 
      text-shadow: 0 4px 20px rgba(165, 180, 252, 0.15); 
    }
    header p { color: #8b8f9e; font-size: 13px; font-weight: 400;}
    
    .chat-box {
      flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 28px; padding-right: 15px; margin-bottom: 20px; scroll-behavior: smooth;
    }
    .chat-box::-webkit-scrollbar { width: 6px; }
    .chat-box::-webkit-scrollbar-thumb { background-color: rgba(255,255,255,0.1); border-radius: 6px; }
    
    .msg-row { display: flex; width: 100%; animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1); }
    @keyframes slideUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
    
    .msg-row.user { justify-content: flex-end; }
    .msg-row.assistant { justify-content: flex-start; }
    
    .bubble {
      max-width: 82%; 
      padding: 16px 22px; 
      font-size: 14.5px; 
      line-height: 1.65; 
      word-wrap: break-word; 
      box-shadow: 0 8px 24px rgba(0,0,0,0.12);
    }
    .msg-row.user .bubble {
      background: linear-gradient(135deg, #5b7afc 0%, #4461e8 100%); 
      color: white; 
      border-radius: 20px 20px 4px 20px;
    }
    .msg-row.assistant .bubble {
      background-color: #2b2d35; 
      color: #f3f4f6; 
      border-radius: 20px 20px 20px 4px; 
      border: 1px solid rgba(255,255,255,0.04);
    }
    .bubble.thinking { 
      color: #8b8f9e; 
      font-style: italic; 
      background-color: transparent !important; 
      box-shadow: none !important; 
      border: none !important; 
      padding: 10px 20px; 
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse { 0% { opacity: 0.5; } 50% { opacity: 1; } 100% { opacity: 0.5; } }
    
    .composer { 
      display: flex; 
      flex-direction: column; 
      background: rgba(30, 30, 36, 0.7); 
      backdrop-filter: blur(12px);
      padding: 16px 20px; 
      border-radius: 20px; 
      border: 1px solid rgba(255,255,255,0.08); 
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    }
    #form { display: flex; align-items: flex-end; gap: 16px; margin-bottom: 8px; }
    textarea {
      flex: 1; background-color: transparent; border: none; color: #f3f4f6; font-family: inherit; font-size: 15px; resize: none; outline: none; min-height: 24px; max-height: 150px; padding: 10px 0; line-height: 1.5;
    }
    textarea::placeholder { color: #6b7280; }
    
    button[type="submit"] {
      background: #5b7afc; 
      color: white; 
      border: none; 
      border-radius: 14px; 
      padding: 12px 26px; 
      font-size: 14.5px; 
      font-weight: 600; 
      cursor: pointer; 
      transition: all 0.2s ease; 
      box-shadow: 0 4px 12px rgba(91, 122, 252, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      height: 44px;
    }
    button[type="submit"]:hover { 
      background: #6a88ff;
      transform: translateY(-2px); 
      box-shadow: 0 6px 18px rgba(91, 122, 252, 0.4); 
    }
    button[type="submit"]:active { transform: translateY(0); }
    button[type="submit"]:disabled { opacity: 0.5; cursor: not-allowed; transform: none; box-shadow: none; }
    
    .footer-note { font-size: 11px; color: #6b7280; text-align: center; margin-top: 8px;}
  </style>
</head>
<body>

  <!-- Sidebar -->
  <div class="sidebar">
    <button class="new-chat-btn" id="newChatBtn">+ New Chat</button>
    <div class="history-list" id="historyList">
      <!-- Session items will be appended here -->
    </div>
  </div>

  <!-- Main Chat Area -->
  <div class="main-area">
    <div class="container">
      <header>
        <h1>Office Calm Chatbot</h1>
        <p>Hidden admin analysis + Gemini response (model: gemini-1.5-flash)</p>
      </header>

      <div class="chat-box" id="chat">
        <!-- Messages go here -->
      </div>

      <div class="composer">
        <form id="form">
          <textarea id="msg" placeholder="Type your office problem... (Kannada/Hindi/English are OK)" rows="1" required></textarea>
          <button type="submit" id="sendBtn">Send</button>
        </form>
        <div class="footer-note">
          Notes: Your hidden analysis prompt stays on the server. The browser only sees your messages and the final reply.
        </div>
      </div>
    </div>
  </div>

  <script>
    const chat = document.getElementById("chat");
    const form = document.getElementById("form");
    const msg = document.getElementById("msg");
    const sendBtn = document.getElementById("sendBtn");
    const historyList = document.getElementById("historyList");
    const newChatBtn = document.getElementById("newChatBtn");
    
    // Store session ID to maintain chat history
    let currentSessionId = null;

    // Load sessions on startup
    async function loadSessions() {
      try {
        const res = await fetch("/api/sessions");
        const data = await res.json();
        historyList.innerHTML = "";
        data.sessions.forEach(s => {
          const div = document.createElement("div");
          div.className = "session-item" + (s.session_id === currentSessionId ? " active" : "");
          div.textContent = s.title || "New Chat";
          div.onclick = () => loadSessionHistory(s.session_id);
          historyList.appendChild(div);
        });
      } catch (err) {
        console.error("Failed to load sessions", err);
      }
    }

    async function loadSessionHistory(sessionId) {
      currentSessionId = sessionId;
      chat.innerHTML = ""; // Clear current chat
      loadSessions(); // Re-render sidebar to update active state
      try {
        const res = await fetch(`/api/sessions/${sessionId}/history`);
        const data = await res.json();
        data.messages.forEach(m => {
          addMsg(m.role, m.content);
        });
      } catch (err) {
        console.error("Failed to load history", err);
      }
    }

    newChatBtn.onclick = () => {
      currentSessionId = null;
      chat.innerHTML = "";
      loadSessions();
    };
    
    // Auto-resize textarea
    msg.addEventListener("input", () => {
      msg.style.height = "auto";
      msg.style.height = Math.min(msg.scrollHeight, 120) + "px";
    });

    // Enter to send
    msg.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        form.dispatchEvent(new Event("submit"));
      }
    });

    function addMsg(role, text) {
      const row = document.createElement("div");
      row.className = "msg-row " + role;
      
      const bubble = document.createElement("div");
      bubble.className = "bubble";
      bubble.innerHTML = text.replace(/\n/g, "<br>");
      
      row.appendChild(bubble);
      chat.appendChild(row);
      chat.scrollTop = chat.scrollHeight;
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const text = msg.value.trim();
      
      if (!text) return;
      
      if (text.length < 2) {
        alert("Please provide a little more detail so I can assist you better!");
        return;
      }
      
      if (text.length > 2000) {
        alert("Your message is too long! Please keep it under 2000 characters.");
        return;
      }
      
      msg.value = "";
      msg.style.height = "auto";
      
      addMsg("user", text);
      
      // Thinking indicator
      const dotsRow = document.createElement("div");
      dotsRow.className = "msg-row assistant";
      dotsRow.innerHTML = '<div class="bubble thinking">...</div>';
      chat.appendChild(dotsRow);
      chat.scrollTop = chat.scrollHeight;
      
      sendBtn.disabled = true;

      try {
        const payload = { message: text };
        if (currentSessionId) {
          payload.session_id = currentSessionId;
        }

        const res = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });
        const data = await res.json();
        dotsRow.remove();
        
        if (data.session_id && data.session_id !== currentSessionId) {
          currentSessionId = data.session_id;
          loadSessions(); // Refresh sidebar with the new session
        }
        
        if (data.error) {
          addMsg("assistant", "Error: " + data.error);
        } else {
          addMsg("assistant", data.reply);
        }
      } catch (err) {
        dotsRow.remove();
        addMsg("assistant", "Connection error.");
      } finally {
        sendBtn.disabled = false;
        msg.focus();
      }
    });

    // Initial load
    loadSessions();
  </script>
</body>
</html>
